[project]
name = "cloud-security-iam-analyzer"
version = "1.0.0"
description = "Cloud Security Posture & IAM Privilege Analyzer with IsolationForest Anomaly Detection"
authors = [{ name = "DevOps Security Team" }]
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "streamlit>=1.35.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.4.0",
    "plotly>=5.20.0",
    "numpy>=1.26.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "black>=24.2.0",
    "flake8>=7.0.0",
]

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | build
  | dist
  | sample_data
)/
'''

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --strict-markers"

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "W503"]
exclude = [".git", ".venv", "__pycache__", "build", "dist"]
