apiVersion: v1
kind: Service
metadata:
  name: cloud-security-analyzer-svc
  labels:
    app.kubernetes.io/name: cloud-security-analyzer
    app.kubernetes.io/component: service
    app.kubernetes.io/part-of: devops-security-suite
spec:
  # Use LoadBalancer for Cloud providers (AWS EKS, Azure AKS, Google GKE).
  # If deploying locally (Minikube / Kind / Docker Desktop), change type to NodePort or use port-forwarding.
  type: LoadBalancer
  ports:
    - name: http
      port: 80
      targetPort: 8501
      # nodePort: 30501 # Uncomment when using type: NodePort
      protocol: TCP
  selector:
    app.kubernetes.io/name: cloud-security-analyzer
