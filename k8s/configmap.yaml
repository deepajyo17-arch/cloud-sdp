apiVersion: v1
kind: ConfigMap
metadata:
  name: cloud-security-analyzer-config
  labels:
    app.kubernetes.io/name: cloud-security-analyzer
    app.kubernetes.io/part-of: devops-security-suite
data:
  STREAMLIT_SERVER_PORT: "8501"
  STREAMLIT_SERVER_ADDRESS: "0.0.0.0"
  STREAMLIT_SERVER_HEADLESS: "true"
  STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
  STREAMLIT_THEME_BASE: "dark"
  ANOMALY_CONTAMINATION_RATE: "0.05"
  LOG_LEVEL: "INFO"
